[project]
name = "docsread"
version = "0.1.0"
description = "약관·상품설명서 PDF를 구조화 데이터로 변환하고 모듈화/편집하는 시스템"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.9.1",
    "openai>=1.60",
    "google-genai>=1.0",
    "anthropic>=2.14.0",
]

[project.optional-dependencies]
# 시험용: Docling(IBM, MIT) 로컬 레이아웃·표 인식. 설치: uv sync --extra docling
docling = ["docling>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/docsread"]
